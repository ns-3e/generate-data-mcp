# Docker MCP catalog entry (community-built tier) for generate-data-mcp.
# _note: image not yet built/pushed as of authoring — placeholder tag below.
# See registry-research.md §3 (github.com/docker/mcp-registry) for submission flow.
name: generate-data-mcp
title: Generate-Data.com
description: >-
  MCP server for Generate-Data.com — generate synthetic datasets from a field
  schema, design schemas from natural language, discover field types, check
  API usage, and list/generate multi-table Projects.
image: ns-3e/generate-data-mcp:2.1.0
type: server
source:
  project: https://github.com/ns-3e/generate-data-mcp
  branch: main
tools:
  - name: gd_generate_dataset
    description: Generate synthetic dataset rows from a field list (CSV, JSON, Parquet, XLSX and more).
  - name: gd_list_field_types
    description: List all available field types grouped by category.
  - name: gd_get_field_type_options
    description: Get the configuration option schema for one field type.
  - name: gd_design_schema
    description: Design a dataset schema from natural language, or refine an existing one via conversation.
  - name: gd_get_usage
    description: Get current API key usage stats (calls today, tier, limits).
  - name: gd_list_projects
    description: List the user's Projects (paginated).
  - name: gd_generate_project
    description: Generate all tables in a Project and download the result.
secrets:
  - name: GENERATE_DATA_API_KEY
    env: GENERATE_DATA_API_KEY
    required: true
    description: Generate-Data.com API key (Settings -> API Access on generate-data.com).
config:
  - name: GENERATE_DATA_API_BASE_URL
    env: GENERATE_DATA_API_BASE_URL
    required: false
    default: https://generate-data.com
    description: Override the Generate-Data.com API base URL (e.g. for local development).
  - name: GENERATE_DATA_OUTPUT_DIR
    env: GENERATE_DATA_OUTPUT_DIR
    required: false
    default: ~/generate-data-output
    description: Directory for results too large to return inline. Mount a volume to read them from outside the container.
