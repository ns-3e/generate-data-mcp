[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "generate-data-mcp"
version = "2.0.1"
description = "MCP server for Generate-Data.com — thin proxy to /api/v2/"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Generate-Data.com" }]
dependencies = [
  "mcp>=1.0.0,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/ns-3e/generate-data-mcp"
Documentation = "https://github.com/ns-3e/generate-data-mcp#readme"
Issues = "https://github.com/ns-3e/generate-data-mcp/issues"

[project.scripts]
generate-data-mcp = "generate_data_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["generate_data_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
