[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "generate-data-mcp"
version = "0.1.0"
description = "MCP server for Generate-Data.com — thin proxy to /api/v2/"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Generate-Data.com" }]
dependencies = [
  "mcp>=1.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/generate-data/generate-data-mcp"
Documentation = "https://github.com/generate-data/generate-data.com/blob/main/docs/API_V2.md"
Issues = "https://github.com/generate-data/generate-data-mcp/issues"

[project.scripts]
generate-data-mcp = "generate_data_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["generate_data_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
